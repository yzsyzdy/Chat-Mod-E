# 身份键（mod_id / mod_version / …）已上收仓库根 gradle.properties，
# 本文件只留平台自己的构建事实。读不到身份键时构建会直接失败（挂载脚本负责）。

# 26.2 要 Java 25 —— 来自官方版本 JSON 的 javaVersion.majorVersion=25，不是猜的。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- Fabric 目标事实（对照 https://fabricmc.net/develop 与官方 26.2 模板）----
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.2

maven_group=com.niuqu.chatbubble
archives_base_name=e33chat-Fabric-26.2

fabric_api_version=0.161.0+26.2

# 【这里没有 yarn_mappings，也不要加回来】26.1 起 Minecraft 不再混淆，Fabric 也不再产出
# Yarn：源码里用的就是官方名，Loom 因此不需要任何 mappings 依赖，产物也不再需要 remap。
# 旧仓的 `mappings "net.fabricmc:yarn:..."` 与整套映射层 / 孪生副本随之下线。

# Store publishing targets (fill after creating the projects; empty = publishing tasks skip)
