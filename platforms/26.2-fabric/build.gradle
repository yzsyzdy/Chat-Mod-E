plugins {
    // 26.2 起 Loom 用这个插件 id（官方 26.2 模板的写法；旧的 'fabric-loom' 还能用，但不跟模板走）。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/e33chat-layers.gradle'

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // 【没有 mappings 依赖，这不是漏写】26.2 不混淆，com.mojang:minecraft 出来的就是带官方名
    // 的可读源码；26.1 起 Fabric 也不再产出 Yarn。旧仓那行
    // `mappings "net.fabricmc:yarn:..."` 与整套映射层/孪生副本随之作废。
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 【为什么是 implementation 而不是 modImplementation】没有映射要 remap，游戏与 Fabric API
    // 的 jar 直接就是可读名，不需要 Loom 的 remap 步骤；官方 26.2 模板同样用 implementation。
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // ModMenu 只有集成类 import 它，且是客户端可选依赖：compileOnly 即可。
    // 【为什么不是 modCompileOnly】26.2 没有映射要 remap，Loom 1.18 也去掉了这一族
    // mod* 配置 —— jar 本来就是可读名，直接用 compileOnly。
    compileOnly "com.terraformersmc:modmenu:20.0.3"
    // WebP emote decoding via TwelveMonkeys ImageIO (picked up by RasterImageDecoder)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(Test).configureEach { useJUnitPlatform() }

// ---------------------------------------------------------------------------
// Store publishing (Modrinth + CurseForge), same pipeline as AtomChat.
// Project IDs live in gradle.properties (modrinth_project_id /
// curseforge_project_id); tokens come from the CI environment only. Tasks
// skip themselves when unconfigured, so local builds and a CI without
// secrets stay green instead of failing the release.
// ---------------------------------------------------------------------------

def storeVersion = "Fabric-${project.minecraft_version}-${project.mod_version}"

// Store changelog convention: the trailing English block of the version
// section in RELEASE_NOTES.md (Chinese summary first, English last; the whole
// bilingual section is for the GitHub release body).
def changelogFor(version) {
    def text = new File(e33chatRepoRoot, 'RELEASE_NOTES.md').getText('UTF-8')
    def start = text.indexOf("## v${version}")
    if (start < 0) {
        return "E33Chat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    def trimmed = section.trim()
    // Store changelog = 分隔线 `----` **之后**的英文块（格式与写法见 skill `changelog-format`）。
    // 【为什么不用"最后一个空行"】英文块自己也会分段（`**Fixed**` + 空行 + 条目），按空行取
    // 只会取到最后一段、把前面几段一起丢掉，而且构建照样是绿的 —— 静默丢失。
    // 用 `-{3,}` 而不是写死三个/四个横线：本仓库历史上两种都写过，不想被横线根数绑架。
    def sep = trimmed =~ /(?m)^-{3,}$/
    return sep.find() ? trimmed.substring(sep.end()).trim() : trimmed
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = (project.findProperty('modrinth_project_id') ?: '').toString()
    versionNumber = storeVersion
    versionType = "release"
    // 【为什么不再有 uploadFile = remapJar】26.2 没有映射，jar 出来就是最终产物，
    // Loom 1.18 也就不再生成 remapJar 任务。minotaur 不写 uploadFile 时默认取
    // 「无 classifier 的那个 jar」，正是我们要发的那个。
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    changelog = changelogFor(project.version)

    dependencies {
        required.project "fabric-api"
    }
}

def mrProjectId = (project.findProperty('modrinth_project_id') ?: '').toString()
tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") && !mrProjectId.isEmpty() }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        // 同样不再有 remapJar：直接传 jar 任务（26.2 无映射，它就是成品）。
        def main = upload(cfProjectId as int, tasks.named('jar').get())
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        main.addGameVersion project.minecraft_version
        main.addModLoader 'Fabric'
        // 26.2 要 Java 25；旧的 Java 21 标签会让商店页面给出错的运行环境提示。
        main.addJavaVersion 'Java 25'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
        main.addRequirement 'fabric-api'
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
